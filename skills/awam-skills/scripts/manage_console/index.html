<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>技能管理控制台</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <a class="skip-link" href="#skillTable">跳到技能表格</a>

  <header class="app-bar">
    <div class="app-bar__inner">
      <span class="app-bar__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="7.5" height="7.5" rx="2.5" />
          <rect x="13.5" y="3" width="7.5" height="7.5" rx="2.5" />
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="2.5" />
          <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.5" />
        </svg>
      </span>

      <div class="app-bar__titles">
        <h1 class="app-bar__title">技能管理控制台</h1>
        <p class="app-bar__sub">规划保存与真正发版分开 · 仅本机 <code>127.0.0.1:8754</code></p>
      </div>

      <div class="app-bar__actions">
        <button type="button" id="btnReload" class="icon-btn" title="重新加载" aria-label="重新加载">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
        </button>
        <button type="button" id="btnTheme" class="icon-btn" title="切换深浅色" aria-label="切换深浅色" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path class="icon-half" d="M12 3a9 9 0 0 1 0 18z"/></svg>
        </button>
        <button type="button" id="btnHelp" class="icon-btn" title="操作说明" aria-label="操作说明">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.2 2.4c-.5.2-.7.7-.7 1.2v.4"/><circle class="icon-dot" cx="12" cy="16.8" r="1.1"/></svg>
        </button>
      </div>
    </div>
    <div id="progress" class="progress hidden" role="progressbar" aria-label="执行中，请稍候">
      <div class="progress__bar"></div>
    </div>
  </header>

  <main class="page">
    <section class="filter-bar" aria-label="筛选">
      <div class="field field--search">
        <svg class="field__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <input type="search" id="filter" class="field__input" placeholder="筛选 key / repo / 简介…" aria-label="筛选技能" autocomplete="off" />
      </div>
      <div class="field field--select">
        <select id="tierFilter" class="field__input" aria-label="按 tier 筛选">
          <option value="">全部 tier</option>
        </select>
        <svg class="field__icon field__icon--end" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
      </div>
      <span class="spacer"></span>
      <span class="chip chip--assist" id="chipCount">— 个技能</span>
      <span class="chip chip--assist" id="chipUpdated">规划更新 —</span>
    </section>

    <section class="card toolbar" aria-label="批量操作">
      <div class="toolbar__row">
        <label class="checkbox">
          <input type="checkbox" id="selectAll" />
          <span class="checkbox__box" aria-hidden="true"></span>
          <span>全选</span>
        </label>
        <span class="muted" id="selCount">已选 0 个</span>
        <span class="spacer"></span>
        <span class="chip chip--warn hidden" id="dirtyHint">0 项未保存改动</span>
        <button type="button" id="btnSavePlan" class="btn btn--tonal" disabled>保存规划</button>
      </div>

      <div class="toolbar__row">
        <span class="field-label">升号</span>
        <div class="segmented" id="bumpPart" role="group" aria-label="升号类型">
          <button type="button" class="segmented__item is-selected" data-part="patch" aria-pressed="true">patch</button>
          <button type="button" class="segmented__item" data-part="minor" aria-pressed="false">minor</button>
          <button type="button" class="segmented__item" data-part="major" aria-pressed="false">major</button>
        </div>
        <button type="button" id="btnUpgrade" class="btn btn--outlined">升级</button>
        <button type="button" id="btnUnmanage" class="btn btn--text btn--danger">移出管理</button>
      </div>

      <div class="toolbar__row">
        <span class="field-label">本次发布平台</span>
        <div id="releasePlatforms" class="chip-group"></div>
        <span class="spacer"></span>
        <button type="button" id="btnRelease" class="btn btn--filled">批量发布</button>
      </div>
    </section>

    <section class="card table-card" aria-label="技能规划表">
      <div class="table-scroll">
        <table id="skillTable">
          <caption class="sr-only">技能 × 平台 的发布规划与状态</caption>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p id="emptyState" class="empty-state hidden">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>
        <span>没有匹配的技能。换个筛选条件，或先用 <code>awam-skills</code> 创建一个技能仓。</span>
      </p>
      <p class="legend">
        单元格底色 = <strong>plan</strong>（可改）· 描边环 = <strong>status</strong>（只读）· 悬浮看完整标签
      </p>
    </section>

    <section class="card log-card" aria-label="运行日志">
      <div class="log-card__head">
        <h2 class="log-card__title">运行日志</h2>
        <button type="button" id="btnClearLog" class="btn btn--text">清空</button>
      </div>
      <pre id="log" class="log" tabindex="0" aria-live="polite" aria-label="日志输出"></pre>
    </section>
  </main>

  <div id="busy" class="busy hidden" aria-hidden="true">
    <div class="busy__card" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="busyText">执行中，请稍候…</span>
    </div>
  </div>

  <div id="dialog" class="scrim hidden">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogBody">
      <h2 id="dialogTitle" class="dialog__title"></h2>
      <p id="dialogBody" class="dialog__body"></p>
      <div class="dialog__actions">
        <button type="button" id="dialogCancel" class="btn btn--text">取消</button>
        <button type="button" id="dialogOk" class="btn btn--text">确定</button>
      </div>
    </div>
  </div>

  <div id="snackbar" class="snackbar" role="status" aria-live="polite">
    <span id="snackbarText"></span>
  </div>

  <script src="/app.js"></script>
</body>
</html>
